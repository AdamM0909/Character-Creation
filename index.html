<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Character Vault</title>
<meta name="description" content="A private codex for writers: characters, places, factions and items with notes, timelines, photos and more.">
<meta name="theme-color" content="#f5f1ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <div id="scrim" class="scrim" hidden></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand-row">
      <button class="brand" id="brand" title="Home"><span class="logo"></span><span class="brand-name">Character Vault</span></button>
      <button class="icon-btn" id="paletteBtn" title="Search &amp; commands (Ctrl+K)" aria-label="Search and commands"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button>
      <button class="icon-btn" id="settingsBtn" title="Settings &amp; appearance" aria-label="Settings"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
    </div>
    <div class="split">
      <button class="btn primary grow" id="newBtn">＋ New</button>
      <button class="btn primary caret" id="newMenuBtn" aria-label="Choose what to create">▾</button>
    </div>
    <nav class="nav" id="nav" aria-label="Views">
      <button data-view="home" title="Home dashboard (Alt+H)"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></button>
      <button data-view="browse" title="Browse (Alt+B)"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Browse</span></button>
      <button data-view="timeline" title="Master timeline (Alt+T)"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Timeline</span></button>
      <button data-view="scenes" title="Scenes"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Scenes</span></button>
      <button data-view="web" title="Relationship web (Alt+W)"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 11l7.6-4M8.2 13l7.6 4"/></svg><span>Web</span></button>
      <button data-view="family" title="Family tree"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/></svg><span>Family</span></button>
      <button data-view="maps" title="Maps"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Maps</span></button>
      <button data-view="compare" title="Compare &amp; merge"><svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="16" rx="1.5"/></svg><span>Compare</span></button>
    </nav>
    <div class="side-block">
      <div class="type-pills" id="typePills" role="tablist"></div>
      <input type="search" id="search" placeholder="Filter by name, tag, text…  ( / )" aria-label="Filter entries">
      <div class="row">
        <select id="filterStory" title="Filter by story"></select>
        <select id="filterRole" title="Filter by kind"></select>
      </div>
      <div class="row">
        <select id="sortBy" title="Sort">
          <option value="updated">Recent</option>
          <option value="name">Name A–Z</option>
          <option value="age">Age</option>
          <option value="created">Newest</option>
          <option value="complete">Complete</option>
        </select>
        <button class="btn small fav-toggle" id="favToggle" title="Show favorites only">★ Favorites</button>
      </div>
      <div class="tagcloud" id="tagCloud"></div>
    </div>
    <ul class="charlist" id="charList"></ul>
    <div class="side-foot">
      <div class="row">
        <button class="btn small" id="exportBtn">Export</button>
        <button class="btn small" id="importBtn">Import</button>
        <button class="btn small" id="moreBtn" aria-label="More tools">⋯</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <p class="muted tiny" id="stats"></p>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar" id="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Open menu"><svg class="ico" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button class="top-title" id="topTitle">Character Vault</button>
      <span class="save-state" id="saveState" data-s="ok">Saved</span>
    </div>
    <div id="backupBar" class="banner" hidden></div>
    <div id="view" class="view"></div>
  </main>
</div>
<datalist id="nameList"></datalist>

<div id="overlay" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="dialog" class="overlay dlg-overlay" hidden><div class="dlg" role="alertdialog" aria-modal="true"></div></div>
<div id="lightbox" class="lightbox" hidden>
  <button class="icon-btn close" id="lbClose" aria-label="Close">✕</button>
  <button class="icon-btn nav prev" id="lbPrev" aria-label="Previous">‹</button>
  <img id="lbImg" alt="">
  <button class="icon-btn nav next" id="lbNext" aria-label="Next">›</button>
  <p id="lbCap"></p>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/core.js"></script>
<script src="js/editor.js"></script>
<script src="js/views.js"></script>
<script src="js/tools.js"></script>
<script src="js/main.js"></script>
</body>
</html>
